map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80으로 오는 요청은 전부 https로 리다이렉트. Cloudflare가 프록시 모드(주황 구름)로
# 이 서버에 접속할 때도 항상 https로 붙으므로 실제로는 거의 안 타지만, 직접 IP나
# DNS-only 상태로 80에 붙는 경우를 위한 안전장치.
server {
    listen 80;
    server_name api.motivhub.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.motivhub.cloud;

    # Cloudflare Origin Certificate - Cloudflare 대시보드(SSL/TLS > Origin Server)에서
    # 발급받아 이 컨테이너에 볼륨으로 마운트한 파일. 공인 인증서가 아니라 Cloudflare만
    # 신뢰하는 인증서라 브라우저가 직접 이 서버에 접속하면 경고가 뜨지만, Cloudflare
    # 프록시(SSL/TLS 모드 Full)를 거치는 정상 경로에서는 문제없다.
    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    client_max_body_size 60M;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        # WebSocket(STOMP/SockJS) 업그레이드 지원 - 이게 없으면 일반 HTTP 요청은
        # 되는데 실시간 협업(WebSocket) 연결만 조용히 실패한다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SockJS 롱폴링/스트리밍 연결이 버퍼링 때문에 끊기지 않도록.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
