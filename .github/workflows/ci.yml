name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 이 레포가 Windows에서 커밋돼서 gradlew에 실행 권한(+x)이 안 붙어있음 - Linux 러너에서
      # 그대로 실행하면 Permission denied로 즉시 실패한다. git 인덱스를 고치는 대신 매번 여기서
      # 명시적으로 부여 - 어떤 OS에서 커밋하든 항상 안전하게 동작한다.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            sgrit78/motivhub-be:latest
            sgrit78/motivhub-be:${{ github.sha }}

      # 재시도 루프(5초 간격 x 최대 10회 = 최대 50초)를 쓰는 이유: 앱이 Flyway 마이그레이션 +
      # Tomcat 기동을 마치는 데 로컬 관찰 기준 10~20초대(편차 있음)가 걸린다. 고정 sleep 하나로는
      # 느릴 때 오탐(아직 안 떴는데 실패 처리)이 날 수 있어서, 뜨는 즉시 바로 성공 처리되는
      # 재시도 루프가 더 안전하다.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_DEPLOY_SSH_KEY }}
          script: |
            cd ~/MotivHub_BE
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d app
            for i in $(seq 1 10); do
              if curl -sf http://localhost/actuator/health/readiness; then
                echo "Deploy healthy"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after deploy"
            exit 1
