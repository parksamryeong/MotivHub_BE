name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 이 레포가 Windows에서 커밋돼서 gradlew에 실행 권한(+x)이 안 붙어있음 - Linux 러너에서
      # 그대로 실행하면 Permission denied로 즉시 실패한다. git 인덱스를 고치는 대신 매번 여기서
      # 명시적으로 부여 - 어떤 OS에서 커밋하든 항상 안전하게 동작한다.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            sgrit78/motivhub-be:latest
            sgrit78/motivhub-be:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # SSH 대신 AWS SSM(Systems Manager)으로 배포 스크립트를 전달한다 - EC2에 상시 열린 포트가
      # 없고(아웃바운드 HTTPS로만 AWS와 통신), 장기 SSH 키 대신 위 OIDC 단기 토큰으로 인증한다.
      #
      # set +e를 쓰는 이유: `aws ssm wait command-executed`는 원격 명령이 실패로 끝나면 자체적으로
      # 0이 아닌 종료 코드를 반환한다. GitHub Actions의 run 블록은 기본 `set -e`가 걸려있어서, 이걸
      # 끄지 않으면 그 시점에 스크립트가 즉시 중단돼 실패 원인(stdout/stderr)을 로그에 못 찍고
      # 끝나버린다. 끝까지 실행한 뒤 $STATUS로 직접 최종 성공/실패를 판정한다.
      - name: Deploy to EC2 via SSM
        run: |
          set +e
          PARAMS_JSON=$(jq -n --arg script "$(cat scripts/ec2-deploy.sh)" '{"commands":[$script]}')
          echo "$PARAMS_JSON" > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi
