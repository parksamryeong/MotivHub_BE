server:
  # nginx가 이 앱 앞에서 리버스 프록시로 붙어있는데, 실제 클라이언트는 https로 접속해도
  # nginx->app 구간은 평문 http라서 이 설정이 없으면 서버가 스킴을 http로 착각한다.
  # OAuth2 redirect-uri의 {baseUrl} 템플릿이 이 착각한 스킴으로 계산돼서, 실제로는
  # https로 등록해둔 콜백 URL과 안 맞아 "redirect_uri not associated" 에러가 났었다.
  # nginx가 이미 X-Forwarded-Proto/X-Forwarded-For 헤더를 보내주고 있으므로(nginx.conf 참고)
  # 이 값만 켜주면 그 헤더를 신뢰해서 원래 스킴/호스트를 정확히 복원한다.
  forward-headers-strategy: framework
  tomcat:
    # 기본값(threads.max=200, accept-count=100)은 순간적으로 동시 연결 시도가 ~300개를 넘으면
    # 나머지를 즉시 "connection refused"로 거부한다(대기열도 아니고 에러도 안 남기고 그냥 거부) -
    # 2026-09-27 부하테스트에서 VU 300~350대에서 실측으로 확인됨. 이 프로젝트가 가정하는 현실적인
    # 동시 사용자 규모(소규모 팀 협업 도구, 수백 명 단위)에 여유를 두기 위해 올린다.
    threads:
      max: 400
    accept-count: 200

spring:
  application:
    name: motivhub-be
  datasource:
    url: jdbc:mysql://localhost:13306/motivhub?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      # 기본값(10)은 Tomcat 스레드 풀을 400으로 올린 뒤 실측(2026-09-27)에서 커넥션 획득 대기시간이
      # 최대 2초까지 튀는 원인으로 확인됨 - Tomcat 한도에 가려져 있던 진짜 병목. 30으로 올려서 재검증.
      # 30은 읽기 위주 시나리오 기준이었는데, 쓰기(태스크 생성/상태변경/댓글작성) 부하테스트(2026-09-27)에서
      # VU150~250대에 실패율이 급증하는 걸 실측 - 쓰기는 트랜잭션 안에서 여러 테이블 INSERT+활동로그+
      # 이벤트 발행까지 하느라 읽기보다 커넥션을 훨씬 오래 붙잡아서 같은 풀이 훨씬 빨리 바닥남.
      # MySQL 자체 max_connections(기본 151)에는 여유가 있어(현재 사용 31개) 60으로 올려서 재검증.
      maximum-pool-size: 60
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user, user:email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: profile_nickname, profile_image, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: 3600000
  refresh-token-expire-ms: 1209600000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  task-edit:
    autosave:
      idle-seconds: 3
      max-wait-seconds: 15
      retry-seconds: 2
  email-verification:
    resend-cooldown-seconds: 30
  realtime:
    presence:
      debounce-window-ms: 200
      poll-interval-ms: 100

# Swagger/OpenAPI는 기본적으로 비활성화 (보안-우선 원칙: 프로덕션 환경에 문서 노출 방지)
# 로컬 개발 환경에서만 활성화하려면 SWAGGER_ENABLED=true 환경변수 설정
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: motivhub-be
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # 로컬 전용 설정: /actuator/health, /actuator/prometheus를 인증 없이 노출한다.
  # 실제 배포 환경에서는 네트워크 격리 또는 actuator 자체 인증을 반드시 추가해야 한다.

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    endpoint-override: ${AWS_S3_ENDPOINT_OVERRIDE:}
